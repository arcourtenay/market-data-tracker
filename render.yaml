databases:
  - name: sec-mgmt-tracker-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: sec-mgmt-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: sec-mgmt-tracker-db
          property: connectionString
      - key: SEC_USER_AGENT
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Cron jobs are a paid Render feature. If you'd rather not pay for that yet,
  # comment these out and run the same commands manually from the web
  # service's Shell tab in the Render dashboard whenever you want fresh data.
  - type: cron
    name: sec-mgmt-tracker-ingest
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 11 * * *" # daily, 11:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.ingest
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: sec-mgmt-tracker-db
          property: connectionString
      - key: SEC_USER_AGENT
        sync: false

  - type: cron
    name: sec-mgmt-tracker-enrich-market-cap
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 12 * * *" # daily, 12:00 UTC (after the above)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.enrich_market_cap
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        fromDatabase:
          name: sec-mgmt-tracker-db
          property: connectionString
      - key: SEC_USER_AGENT
        sync: false
